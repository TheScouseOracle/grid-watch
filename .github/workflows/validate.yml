name: Validate Grid Watch
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate open data
        run: python scripts/validate_open_data.py
      - name: Validate site evidence and static frontend
        run: node scripts/check_frontend.cjs
      - name: Check navigation and loading
        run: node scripts/check_navigation.cjs
      - name: Check electricity layer and provenance
        run: node scripts/check_electricity.cjs
      - name: Validate regional electricity snapshot
        run: python scripts/check_electricity_data.py
