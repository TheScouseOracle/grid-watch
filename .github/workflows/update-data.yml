name: Refresh Grid Watch open data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: grid-watch-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh OpenStreetMap UK data centres
        run: python scripts/update_osm.py
      - name: Refresh England planning candidates
        run: python scripts/update_planning.py
      - name: Refresh UK electricity infrastructure
        run: python scripts/update_grid.py
      - name: Commit changed datasets
        run: |
          git config user.name "grid-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datacentres-osm.json planning.json grid.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh UK open data"
            git push
          fi
